    const STORAGE_KEY = 'INSTAKITCHEN_TSX_FULL_V2';
    const THEME_STORAGE_KEY = 'INSTAKITCHEN_THEME_V2';

    function App() {
      // 菜谱核心数据状态（支持本地持久化）

      // 新建菜谱：结构化详细步骤列表与当前正在编写的单步编辑器状态

      // 处理真机拍照或相册上传图片
      const handlePhotoUpload = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const maxDim = 800;
            let w = img.width;
            let h = img.height;
            if (w > h && w > maxDim) {
              h = Math.round((h * maxDim) / w);
              w = maxDim;
            } else if (h > maxDim) {
              w = Math.round((w * maxDim) / h);
              h = maxDim;
            }
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            setNewPhoto(canvas.toDataURL('image/jpeg', 0.78));
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      };

      // 分步倒计时器每秒跳动 Effect
      useEffect(() => {
        const timer = setInterval(() => {
          setStepTimers((prev) => {
            let changed = false;
            const next = { ...prev };
            Object.keys(next).forEach((k) => {
              if (next[k].running && next[k].remaining > 0) {
                changed = true;
                const rem = next[k].remaining - 1;
                next[k] = {
                  ...next[k],
                  remaining: rem,
                  running: rem > 0
                };
              }
            });
            return changed ? next : prev;
          });
        }, 1000);
        return () => clearInterval(timer);
      }, []);

      // 启动/暂停某一步骤的计时器（同时同步信息到顶部灵动岛 Live Activity）
      const toggleStepTimer = (stepKey, defaultSeconds, meta = {}) => {
        setStepTimers((prev) => {
          const current = prev[stepKey] || {
            remaining: defaultSeconds,
            running: false,
            total: defaultSeconds,
            recipeTitle: meta.recipeTitle || '私房菜',
            stage: meta.stage || '烹饪计时',
            recipeId: meta.recipeId || activeRecipeId
          };
          const rem = current.remaining === 0 ? defaultSeconds : current.remaining;
          return {
            ...prev,
            [stepKey]: {
              ...current,
              remaining: rem,
              total: defaultSeconds,
              recipeTitle: meta.recipeTitle || current.recipeTitle,
              stage: meta.stage || current.stage,
              recipeId: meta.recipeId || current.recipeId,
              running: !current.running
            }
          };
        });
      };

      const resetStepTimer = (stepKey, defaultSeconds) => {
        setStepTimers((prev) => ({
          ...prev,
          [stepKey]: {
            ...(prev[stepKey] || {}),
            remaining: defaultSeconds,
            running: false
          }
        }));
      };

      const formatTimer = (sec) => {
        const m = Math.floor(sec / 60);
        const s = sec % 60;
        return m > 0 ? `${m}分${s < 10 ? '0' : ''}${s}秒` : `${s}秒`;
      };

      // 功能 6：计算当前正在运行的灵动岛 Live Activity 计时器
      const activeLiveTimer = useMemo(() => {
        const entries = Object.entries(stepTimers);
        const runningEntry = entries.find(([, val]) => val.running && val.remaining > 0);
        if (runningEntry) return { key: runningEntry[0], ...runningEntry[1] };
        const pausedEntry = entries.find(([, val]) => val.remaining > 0 && val.remaining < (val.total || 99999));
        if (pausedEntry) return { key: pausedEntry[0], ...pausedEntry[1] };
        return null;
      }, [stepTimers]);

      // 功能 2：跨菜谱自动合并汇总待买食材清单 (Smart Grocery Bag)
      const mergedGroceryList = useMemo(() => {
        const bookmarkedRecipes = recipes.filter((r) => r.isBookmarked);
        const map = {};
        bookmarkedRecipes.forEach((recipe) => {
          recipe.ingredients.forEach((ing) => {
            const key = `${ing.name.trim()}_${ing.unit.trim()}`;
            if (!map[key]) {
              map[key] = {
                key,
                name: ing.name.trim(),
                unit: ing.unit.trim(),
                totalAmount: 0,
                fromRecipes: []
              };
            }
            map[key].totalAmount = Math.round((map[key].totalAmount + Number(ing.amount || 0)) * 10) / 10;
            if (!map[key].fromRecipes.includes(recipe.title)) {
              map[key].fromRecipes.push(recipe.title);
            }
          });
        });
        return Object.values(map);
      }, [recipes]);

      // 功能 4：添加一次新的试做打卡复盘记录
      const handleAddCookingLog = (recipeId) => {
        if (!newLogNote.trim()) return;
        const today = new Date().toISOString().slice(0, 10);
        setRecipes((prev) =>
          prev.map((r) => {
            if (r.id !== recipeId) return r;
            const currentLogs = r.cookingLogs || [];
            const newLog = {
              id: 'log_' + Date.now(),
              date: today,
              attempt: currentLogs.length + 1,
              rating: newLogRating,
              note: newLogNote.trim(),
              badge: newLogBadge

            return {
              ...r,
              cookingLogs: [newLog, ...currentLogs]

          })

        setNewLogNote('');

      const openBackupCenter = () => {

      };

      const handleCopyBackupJson = () => {
        const textarea = document.createElement('textarea');
        textarea.value = backupJsonText;

        document.execCommand('copy');
        document.body.removeChild(textarea);

      const handleDownloadBackupFile = () => {
        const blob = new Blob([backupJsonText], { type: 'application/json' });

        const a = document.createElement('a');
        a.href = url;
        a.download = `InstaKitchen_Recipes_Backup_${new Date().toISOString().slice(0, 10)}.json`;
        a.click();
        URL.revokeObjectURL(url);
        setBackupToast('📦 已导出 .json 菜谱备份文件！');
      };

      const handleImportBackupJson = () => {
        try {
          const parsed = JSON.parse(backupJsonText);
          if (Array.isArray(parsed) && parsed.length > 0 && parsed[0].title) {
            setRecipes(parsed);
            setBackupToast(`🎉 成功恢复 ${parsed.length} 道私房菜谱数据！`);

            setBackupToast('⚠️ JSON 格式不完整，请确保包含有效的菜谱数组');

      // 在「发布新私房菜」中添加或保存当前编辑的详细步骤
      const handleSaveStepItem = () => {
        if (!stepInstruction.trim()) return;
        const stepObj = {
          id: 'ns_' + Date.now(),
          stage: stepStage,
          heat: stepHeat,
          durationSec: Number(stepDuration) || 0,

          instruction: stepInstruction.trim(),
          tip: stepTip.trim()

          const updated = [...newSteps];
          updated[editingStepIndex] = stepObj;
          setNewSteps(updated);
          setEditingStepIndex(null);
        } else {
          setNewSteps([...newSteps, stepObj]);

        setStepInstruction('');
        setStepTip('');
        setStepSeasonings([]);
        setStepDuration('60');

          setStepHeat('大火');

      const handleEditStepItem = (idx) => {

      const moveStepItem = (idx, dir) => {
        const targetIdx = idx + dir;
        if (targetIdx < 0 || targetIdx >= newSteps.length) return;
        const copy = [...newSteps];

      const filteredRecipes = useMemo(() => {

            r.ingredients.some((i) => i.name.toLowerCase().includes(q));

                            {STEP_STAGES.map((st) => (
                              <button
                                key={st.value}
                                type="button"
                                onClick={() => setStepStage(st.value)}
                                className={`px-2 py-1 rounded-lg text-[10px] font-semibold border transition ${
                                  stepStage === st.value
                                    ? 'border-pink-500 bg-pink-500 text-white shadow-sm'
                                    : `${borderCol} ${bgMain}`
                                }`}
                              >
                                {st.label}
                              </button>
                            ))}
                          </div>
                        </div>

                        <div className="grid grid-cols-2 gap-2">
                          <div className="space-y-1">
                            <span className={`text-[10px] ${textMuted}`}>② 火候控制：</span>
                            <div className="grid grid-cols-2 gap-1">
                              {HEAT_LEVELS.map((h) => (
                                <button
                                  key={h.value}
                                  type="button"
                                  onClick={() => setStepHeat(h.value)}
                                  className={`py-1 px-1.5 rounded-lg text-[10px] font-medium border transition ${
                                    stepHeat === h.value
                                      ? 'border-orange-500 bg-orange-500/15 text-orange-500 font-bold'
                                      : `${borderCol} ${bgMain}`
                                  }`}
                                >
                                  {h.label}
                                </button>
                              ))}
                            </div>
                          </div>

                          <div className="space-y-1">
                            <span className={`text-[10px] ${textMuted}`}>③ 本步计时(秒)：</span>
                            <div className={`px-2.5 py-1.5 rounded-xl border ${borderCol} ${bgMain} flex items-center justify-between`}>
                              <Timer className="w-3.5 h-3.5 text-amber-500" />
                              <input
                                type="number"
                                value={stepDuration}
                                onChange={(e) => setStepDuration(e.target.value)}
                                placeholder="如120"
                                className="w-12 bg-transparent text-right font-bold focus:outline-none"
                              />
                              <span className={`text-[10px] ${textMuted}`}>秒</span>
                            </div>
                            <div className="flex gap-1">
                              {[30, 60, 180, 600].map((sec) => (
                                <button
                                  key={sec}
                                  type="button"
                                  onClick={() => setStepDuration(String(sec))}
                                  className={`flex-1 py-0.5 rounded text-[9px] border ${borderCol} ${bgMain}`}
                                >
                                  {sec >= 60 ? `${sec / 60}分` : `${sec}秒`}
                                </button>
                              ))}
                            </div>
                          </div>
                        </div>

                        <div className="space-y-1.5">
                          <span className={`text-[10px] ${textMuted}`}>
                            ④ 本步放入的调料与用量（点快捷标签直接加入本步）：
                          </span>

                          {stepSeasonings.length > 0 && (
                            <div className="flex flex-wrap gap-1 pb-0.5">
                              {stepSeasonings.map((sea, sIdx) => (
                                <span
                                  key={sIdx}
                                  className="px-2 py-0.5 rounded-full bg-blue-500 text-white text-[10px] font-semibold flex items-center gap-1"
                                >
                                  {sea}
                                  <button
                                    type="button"
                                    onClick={() =>
                                      setStepSeasonings(stepSeasonings.filter((_, i) => i !== sIdx))
                                    }
                                  >
                                    <X className="w-2.5 h-2.5" />
                                  </button>
                                </span>
                              ))}
                            </div>
                          )}

                          <div className="flex flex-wrap gap-1">
                            {QUICK_SEASONINGS.map((qs) => {
                              const label = `${qs.name} ${qs.amount}`;
                              return (
                                <button
                                  key={label}
                                  type="button"
                                  onClick={() => {
                                    if (!stepSeasonings.includes(label)) {
                                      setStepSeasonings([...stepSeasonings, label]);
                                    }
                                  }}
                                  className={`px-2 py-0.5 rounded-md text-[10px] border ${borderCol} ${bgMain} hover:border-blue-400 transition`}
                                >
                                  +{qs.name}({qs.amount})
                                </button>
                              );
                            })}
                          </div>

                          <div className="flex gap-1 pt-0.5">
                            <input
                              type="text"
                              value={customSeasoningName}
                              onChange={(e) => setCustomSeasoningName(e.target.value)}
                              placeholder="其他调料(如:豆瓣酱)"
                              className={`flex-1 px-2 py-1 rounded-lg border ${borderCol} ${bgMain} text-[11px]`}
                            />
                            <input
                              type="text"
                              value={customSeasoningQty}
                              onChange={(e) => setCustomSeasoningQty(e.target.value)}
                              placeholder="用量(如:1勺/5克)"
                              className={`w-24 px-2 py-1 rounded-lg border ${borderCol} ${bgMain} text-[11px]`}
                            />
                            <button
                              type="button"
                              onClick={() => {
                                if (!customSeasoningName.trim()) return;
                                const combined = `${customSeasoningName.trim()} ${
                                  customSeasoningQty.trim() || '适量'
                                }`;
                                setStepSeasonings([...stepSeasonings, combined]);
                                setCustomSeasoningName('');
                                setCustomSeasoningQty('');
                              }}
                              className="px-2.5 py-1 rounded-lg bg-zinc-700 text-white text-[10px] font-bold"
                            >
                              加入本步
                            </button>
                          </div>
                        </div>

                        <div className="space-y-1.5">
                          <span className={`text-[10px] ${textMuted}`}>⑤ 详细操作过程与火候解说：</span>
                          <textarea
                            rows={3}
                            value={stepInstruction}
                            onChange={(e) => setStepInstruction(e.target.value)}
                            placeholder="详细记录这一步怎么做：例如冷水下锅放入排骨，加入姜片和1勺料酒，大火烧开煮3分钟撇净血沫，捞出温水洗净..."
                            className={`w-full p-2 rounded-xl border ${borderCol} ${bgMain} text-[11px] leading-relaxed focus:outline-none`}
                          />
                          <input
                            type="text"
                            value={stepTip}
                            onChange={(e) => setStepTip(e.target.value)}
                            placeholder="💡 关键状态判断/避坑提示（选填，如：炒至排骨边缘微焦金黄）"
                            className={`w-full px-2.5 py-1.5 rounded-xl border ${borderCol} ${bgMain} text-[11px] focus:outline-none`}
                          />
                        </div>

                        <button
                          type="button"
                          onClick={handleSaveStepItem}
                          style={{ backgroundColor: accentColor }}
                          className="w-full py-2 rounded-xl text-white font-bold text-xs shadow-sm hover:opacity-95 active:scale-[0.99] transition"
                        >
                          {editingStepIndex !== null
                            ? `✓ 保存第 ${editingStepIndex + 1} 步修改`
                            : `+ 添加为第 ${newSteps.length + 1} 步工序`}
                        </button>
                      </div>
                    </div>

                    {/* 5. 烹饪总心得 */}
                    <div className="space-y-1.5">
                      <label className="font-bold block">5. 主厨总结文案</label>
                      <textarea
                        rows={2}
                        value={newNotes}
                        onChange={(e) => setNewNotes(e.target.value)}
                        placeholder="记录火候秘诀或调味比例..."
                        className={`w-full p-2.5 rounded-xl border ${borderCol} ${bgSecondary} focus:outline-none`}
                      />
                    </div>
                  </div>
                </div>
              )}

              {/* 底部仿 Instagram TabBar 导航条 */}
              <div
                style={{ paddingBottom: 'var(--safe-bottom)' }}
                className={`h-14 border-t ${borderCol} ${bgMain} px-6 flex items-center justify-between z-20`}
              >
                <button
                  onClick={() => {
                    setActiveRecipeId(null);
                    setActiveTab('feed');
                  }}
                  className="p-1"
                >
                  <List className={`w-5 h-5 ${activeTab === 'feed' && !activeRecipe ? 'stroke-[2.5]' : 'opacity-50'}`} />
                </button>
                <button
                  onClick={() => {
                    setActiveRecipeId(null);
                    setActiveTab('grid');
                  }}
                  className="p-1"
                >
                  <Grid className={`w-5 h-5 ${activeTab === 'grid' && !activeRecipe ? 'stroke-[2.5]' : 'opacity-50'}`} />
                </button>
                <button
                  onClick={() => setIsAddModalOpen(true)}
                  className="p-1"
                >
                  <PlusSquare className="w-5 h-5" />
                </button>
                <button
                  onClick={() => {
                    setActiveRecipeId(null);
                    setActiveTab('saved');
                  }}
                  className="p-1 relative"
                >
                  <Bookmark className={`w-5 h-5 ${activeTab === 'saved' && !activeRecipe ? 'stroke-[2.5]' : 'opacity-50'}`} />
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
